<body class="enter-page">
  <main class="enter-wrap">
    <form class="enter-card" id="enter-form" autocomplete="off">
      <img class="enter-logo" src="/img/logo-light.svg" alt="Wild Imaginary West">
      <div class="enter-kicker">THE POSSE’S TABLE KIT</div>
      <h1>Say the password, partner</h1>
      <label class="enter-field"><span class="enter-lbl">PASSWORD</span>
        <input type="password" id="enter-pw" autocomplete="current-password" required autofocus aria-describedby="enter-msg"></label>
      <button type="submit" class="btn enter-go">Ride in</button>
      <p class="enter-msg" id="enter-msg" role="status" aria-live="polite"></p>
      <p class="enter-fine">You only need it once on each device.</p>
    </form>
