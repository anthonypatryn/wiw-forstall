<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campaign · Wild Imaginary West</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="The Warden’s campaign: storylines, clocks and what ties them together.">

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/img/icon-180.png">
  <meta name="theme-color" content="#151d22">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,700;1,400&family=Bebas+Neue&family=Rye&family=Special+Elite&family=Reenie+Beanie&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=183">
  <link rel="stylesheet" href="/css/prep.css?v=99">
  <link rel="stylesheet" href="/css/campaign.css?v=10">
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <img class="brand-logo" src="/img/logo-light.svg" alt="Wild Imaginary West">
      <div class="brand-title">
        <div class="kicker">WARDEN ONLY</div>
        <h1>Campaign</h1>
        <div class="sub">Your notebook, the storylines, and everything in play</div>
      </div>
    </div>
  </header>
  <nav class="sitenav" data-nav aria-label="Site"></nav>

  <main class="wrap">
    <section class="card corner" id="gate" hidden>
      <h2 class="section-title">Warden only</h2>
      <p class="muted">The campaign is just for the Warden.</p>
      <button class="btn" id="unlock" type="button"><span data-gl="star"></span> Enter the Warden PIN</button>
    </section>
    <div id="camp" hidden>
      <div class="chip-row cp-tabs" id="cp-tabs" role="tablist" aria-label="Campaign"></div>
      <div class="prep-grid cp-grid" id="cp-two">
        <section class="card corner prep-list cp-list">
          <div class="head-row"><h2 class="section-title" id="cp-list-h">Notes</h2><button type="button" class="btn small" id="cp-new" data-cp-new>+ New note</button></div>
          <div id="cp-list"><p class="loading" role="status">Loading…</p></div>
        </section>
        <section class="card corner prep-edit cp-edit" id="editor"></section>
      </div>
      <div id="cp-inplay" class="prep-edit" hidden></div>
    </div>
  </main>

  <script type="module" src="/js/campaign.js?v=10"></script>
</body>
</html>
