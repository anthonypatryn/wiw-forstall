<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Journal · Wild Imaginary West</title>
  <meta name="description" content="The posse’s journal: quests, clues and the newspapers.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>★</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,700;1,400&family=Bebas+Neue&family=Rye&family=Special+Elite&family=Reenie+Beanie&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=67">
  <link rel="stylesheet" href="/css/journal.css?v=2">
  <link id="paper-css" rel="stylesheet" href="/css/paper.css?v=1">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap">
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <img class="brand-logo" src="/img/logo-light.svg" alt="Wild Imaginary West">
      <div class="brand-title">
        <div class="kicker">WHAT THE POSSE KNOWS</div>
        <h1>Journal</h1>
        <div class="sub">Quests, clues, and the papers that told your story</div>
      </div>
    </div>
  </header>
  <nav class="sitenav" data-nav aria-label="Site"></nav>

  <main class="wrap">
    <nav class="jn-tabs" aria-label="Journal sections">
      <button type="button" class="chip-btn" data-tab="quests">Quests</button>
      <button type="button" class="chip-btn" data-tab="clues">Clues</button>
      <button type="button" class="chip-btn" data-tab="papers">Newspapers</button>
    </nav>
    <section class="card corner" data-pane="quests">
      <div class="head-row"><h2 class="section-title">Quests</h2><span data-warden-only hidden><button type="button" class="btn small" data-new-quest>+ New quest</button></span></div>
      <div id="quests"></div>
    </section>
    <section class="card corner" data-pane="clues" hidden>
      <div class="head-row"><h2 class="section-title">Clues</h2><span data-warden-only hidden><button type="button" class="btn small" data-new-clue>+ New clue</button></span></div>
      <div class="jc-filter" id="clue-filter"></div>
      <div class="jc-board" id="clues"></div>
    </section>
    <section class="card corner" data-pane="papers" hidden>
      <h2 class="section-title">The Newspapers</h2>
      <p class="muted small-text mt-0">Every front page printed about the posse, newest first. Tap one to read it.</p>
      <div class="jn-papers" id="papers"></div>
    </section>
  </main>

  <script type="module" src="/js/journal.js?v=14"></script>
</body>
</html>
